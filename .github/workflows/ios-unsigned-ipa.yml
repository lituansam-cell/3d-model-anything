# Builds an unsigned .ipa of the iPhone app on a GitHub macOS runner.
# Sign and install it from Windows with Sideloadly (free Apple ID: re-install every 7 days).
name: iOS unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build (no signing)
        working-directory: apps/house-capture
        run: |
          xcodegen generate
          xcodebuild -project HouseCapture.xcodeproj -scheme HouseCapture -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package .ipa
        working-directory: apps/house-capture
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HouseCapture.app Payload/
          zip -qry HouseCapture-unsigned.ipa Payload
          ls -la HouseCapture-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HouseCapture-unsigned-ipa
          path: apps/house-capture/HouseCapture-unsigned.ipa
